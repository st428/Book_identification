<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>书架智能巡检</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">Library Shelf Inspector</p>
        <h1>书架智能巡检</h1>
      </div>
      <div id="ocrStatus" class="status">OCR：检查中</div>
    </header>

    <section class="upload-panel" aria-label="上传图片">
      <div class="field">
        <label class="field-label" for="imageInput">图片</label>
        <div class="file-picker">
          <input id="imageInput" class="file-input" type="file" accept="image/*" multiple>
          <label class="file-button" for="imageInput">选择文件</label>
          <span id="filePickerText" class="file-picker-text">未选择文件</span>
        </div>
        <p id="fileSummary" class="hint">未选择图片</p>
      </div>

      <div class="field">
        <span class="field-label">模式</span>
        <div class="mode-control" role="radiogroup" aria-label="处理模式">
          <label>
            <input type="radio" name="mode" value="standard" checked>
            <span>普通</span>
          </label>
          <label>
            <input type="radio" name="mode" value="fine">
            <span>精细</span>
          </label>
        </div>
      </div>

      <div class="actions">
        <button id="submitButton" type="button">开始识别</button>
        <button id="clearFilesButton" class="secondary-button" type="button">清空</button>
      </div>
      <p id="message" class="message">使用官方 OCR 稳定版。</p>
    </section>

    <section id="resultPanel" class="result-panel hidden" aria-label="识别结果">
      <div class="result-header">
        <h2>识别结果</h2>
        <p id="batchMeta" class="meta"></p>
      </div>
      <div id="resultsList" class="results-list"></div>
    </section>
  </main>

  <template id="resultTemplate">
    <article class="result-item">
      <div class="item-title">
        <h3 class="image-name"></h3>
        <span class="cache-pill"></span>
      </div>
      <div class="stats">
        <div><strong class="total-count">0</strong><span>检测</span></div>
        <div><strong class="green-count">0</strong><span>绿</span></div>
        <div><strong class="yellow-count">0</strong><span>黄</span></div>
        <div><strong class="red-count">0</strong><span>红</span></div>
      </div>
      <p class="meta item-meta"></p>
      <ul class="warning-list hidden"></ul>
      <img class="annotated-image" alt="识别标注图">
      <div class="link-row">
        <a class="export-link export-csv" target="_blank" rel="noopener">导出 CSV</a>
        <a class="export-link export-json" target="_blank" rel="noopener">导出 JSON</a>
        <a class="diagnostics-link hidden" target="_blank" rel="noopener">crop 诊断</a>
      </div>
      <section class="review-box">
        <div class="review-header">
          <h4>人工复核</h4>
          <button class="secondary-button save-review-button" type="button">保存复核记录</button>
        </div>
        <div class="review-list"></div>
        <p class="review-message meta"></p>
      </section>
      <section class="suggestion-box">
        <h4>调架建议</h4>
        <ul class="suggestion-list"></ul>
      </section>
      <details>
        <summary>识别顺序</summary>
        <ol class="order-list"></ol>
      </details>
    </article>
  </template>

  <script>
    const imageInput = document.querySelector("#imageInput");
    const submitButton = document.querySelector("#submitButton");
    const clearFilesButton = document.querySelector("#clearFilesButton");
    const message = document.querySelector("#message");
    const resultPanel = document.querySelector("#resultPanel");
    const ocrStatus = document.querySelector("#ocrStatus");
    const filePickerText = document.querySelector("#filePickerText");
    const fileSummary = document.querySelector("#fileSummary");
    const batchMeta = document.querySelector("#batchMeta");
    const resultsList = document.querySelector("#resultsList");
    const resultTemplate = document.querySelector("#resultTemplate");
    let selectedFiles = [];

    function selectedMode() {
      return document.querySelector("input[name='mode']:checked")?.value || "standard";
    }

    async function refreshStatus() {
      try {
        const response = await fetch("/api/status");
        const data = await response.json();
        const labels = {
          loaded: "OCR：已加载",
          loading: "OCR：加载中",
          not_loaded: "OCR：未加载"
        };
        const model = data.ocr_model ? ` · ${data.ocr_model}` : "";
        ocrStatus.textContent = `${labels[data.ocr_status] || "OCR：未知"}${model}`;
      } catch {
        ocrStatus.textContent = "OCR：服务未连接";
      }
    }

    async function preload() {
      try {
        await fetch("/api/preload", { method: "POST" });
      } catch {}
    }

    function updateFileSummary() {
      const count = selectedFiles.length;
      if (count === 0) {
        filePickerText.textContent = "未选择文件";
        fileSummary.textContent = "未选择图片";
        return;
      }
      filePickerText.textContent = `已选择 ${count} 张`;
      const names = selectedFiles.slice(0, 3).map((file) => file.name).join("、");
      const suffix = count > 3 ? ` 等 ${count} 张` : ` 共 ${count} 张`;
      fileSummary.textContent = `${names}${suffix}`;
    }

    function fileKey(file) {
      return `${file.name}_${file.size}_${file.lastModified}`;
    }

    function addSelectedFiles(files) {
      const known = new Set(selectedFiles.map(fileKey));
      files.forEach((file) => {
        if (!known.has(fileKey(file))) {
          selectedFiles.push(file);
          known.add(fileKey(file));
        }
      });
      imageInput.value = "";
      updateFileSummary();
    }

    function defaultReviewStatus(entry) {
      if ((entry.text || "") === "UNREAD") {
        return "unreadable";
      }
      return "confirmed";
    }

    function drawRotatedCrop(imageUrl, container) {
      container.innerHTML = "";
      const status = document.createElement("p");
      status.className = "crop-preview-status";
      status.textContent = "正在加载 crop...";
      container.appendChild(status);

      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalHeight;
        canvas.height = image.naturalWidth;
        const context = canvas.getContext("2d");
        context.translate(0, canvas.height);
        context.rotate(-Math.PI / 2);
        context.drawImage(image, 0, 0);
        container.innerHTML = "";
        container.appendChild(canvas);
        container.dataset.loaded = "true";
      };
      image.onerror = () => {
        delete container.dataset.loaded;
        status.textContent = "crop 加载失败。";
      };
      image.src = imageUrl;
    }

    function createReviewRow(entry, index) {
      const row = document.createElement("div");
      row.className = "review-row";
      row.dataset.cropId = entry.crop_id || `crop_${String(index + 1).padStart(3, "0")}`;
      row.dataset.ocrText = entry.ocr_text || entry.text || "";

      const title = document.createElement("div");
      title.className = "review-title";
      const titleText = document.createElement("span");
      titleText.textContent = `${row.dataset.cropId} · ${entry.text || "UNREAD"}`;
      title.appendChild(titleText);
      let cropPreview = null;
      if (entry.crop_url) {
        const cropButton = document.createElement("button");
        cropButton.className = "crop-toggle";
        cropButton.type = "button";
        cropButton.textContent = "查看crop";
        cropButton.addEventListener("click", () => {
          if (!cropPreview) {
            return;
          }
          const showPreview = cropPreview.classList.contains("hidden");
          cropPreview.classList.toggle("hidden", !showPreview);
          cropButton.textContent = showPreview ? "收起crop" : "查看crop";
          if (showPreview && cropPreview.dataset.loaded !== "true") {
            drawRotatedCrop(entry.crop_url, cropPreview);
          }
        });
        title.appendChild(cropButton);
      }

      const statusSelect = document.createElement("select");
      statusSelect.className = "review-status";
      [
        ["confirmed", "确认正确"],
        ["corrected", "已修正"],
        ["unreadable", "无法识别"],
        ["ignored", "忽略"]
      ].forEach(([value, label]) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        statusSelect.appendChild(option);
      });
      statusSelect.value = defaultReviewStatus(entry);

      const correctedInput = document.createElement("input");
      correctedInput.className = "review-corrected";
      correctedInput.type = "text";
      correctedInput.placeholder = "修正后的索书号";
      correctedInput.value = (entry.text || "") === "UNREAD" ? "" : entry.text || "";

      const noteInput = document.createElement("input");
      noteInput.className = "review-note";
      noteInput.type = "text";
      noteInput.placeholder = "备注";

      row.appendChild(title);
      row.appendChild(statusSelect);
      row.appendChild(correctedInput);
      row.appendChild(noteInput);
      if (entry.crop_url) {
        cropPreview = document.createElement("div");
        cropPreview.className = "crop-preview hidden";
        row.appendChild(cropPreview);
      }
      return row;
    }

    async function loadReviewSummary(node, resultId) {
      const reviewMessage = node.querySelector(".review-message");
      try {
        const response = await fetch(`/api/reviews?result_id=${encodeURIComponent(resultId)}`);
        const data = await response.json();
        if (data.ok && data.items.length > 0) {
          reviewMessage.textContent = `已有 ${data.items.length} 条历史复核记录。`;
        }
      } catch {}
    }

    async function saveReviewRecords(node, item) {
      const reviewMessage = node.querySelector(".review-message");
      const saveButton = node.querySelector(".save-review-button");
      const rows = Array.from(node.querySelectorAll(".review-row"));
      const payload = {
        result_id: item.result_id,
        image_name: item.image,
        items: rows.map((row) => ({
          crop_id: row.dataset.cropId,
          ocr_text: row.dataset.ocrText,
          corrected_text: row.querySelector(".review-corrected").value.trim(),
          status: row.querySelector(".review-status").value,
          note: row.querySelector(".review-note").value.trim()
        }))
      };

      saveButton.disabled = true;
      reviewMessage.textContent = "正在保存复核记录...";
      try {
        const response = await fetch("/api/review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!data.ok) {
          throw new Error(data.error || "复核记录保存失败");
        }
        reviewMessage.textContent = `已保存 ${data.saved_count} 条复核记录。`;
      } catch (error) {
        reviewMessage.textContent = error.message;
      } finally {
        saveButton.disabled = false;
      }
    }

    function renderResult(item) {
      const node = resultTemplate.content.firstElementChild.cloneNode(true);
      node.querySelector(".image-name").textContent = item.image;
      node.querySelector(".cache-pill").textContent = item.from_cache ? "缓存" : "新识别";
      node.querySelector(".cache-pill").classList.toggle("cached", item.from_cache);
      node.querySelector(".total-count").textContent = item.counts.total;
      node.querySelector(".green-count").textContent = item.counts.green;
      node.querySelector(".yellow-count").textContent = item.counts.yellow;
      node.querySelector(".red-count").textContent = item.counts.red;
      node.querySelector(".item-meta").textContent = `方向：${item.rotate || "auto"}，耗时：${item.elapsed_seconds}s`;
      node.querySelector(".annotated-image").src = `${item.annotated_url}?t=${Date.now()}`;
      node.querySelector(".export-csv").href = item.export_csv_url || `/api/export?result_id=${encodeURIComponent(item.result_id)}&format=csv`;
      node.querySelector(".export-json").href = item.export_json_url || `/api/export?result_id=${encodeURIComponent(item.result_id)}&format=json`;

      const diagnosticsLink = node.querySelector(".diagnostics-link");
      if (item.diagnostics_url) {
        diagnosticsLink.href = item.diagnostics_url;
        diagnosticsLink.classList.remove("hidden");
      }

      const warningList = node.querySelector(".warning-list");
      (item.warnings || []).forEach((text) => {
        const li = document.createElement("li");
        li.textContent = text;
        warningList.appendChild(li);
      });
      warningList.classList.toggle("hidden", warningList.children.length === 0);

      const suggestionList = node.querySelector(".suggestion-list");
      (item.suggestions || []).forEach((text) => {
        const li = document.createElement("li");
        li.textContent = text;
        suggestionList.appendChild(li);
      });

      const orderList = node.querySelector(".order-list");
      const orderItems = item.order_items || item.actual_order.map((text) => ({ text, status_label: "未知" }));
      const reviewList = node.querySelector(".review-list");
      orderItems.forEach((entry) => {
        const li = document.createElement("li");
        li.className = `order-${entry.status || "unknown"}`;
        const main = document.createElement("div");
        main.className = "order-main";
        main.textContent = `${entry.text}（${entry.status_label || ""}）`;
        const detail = document.createElement("div");
        detail.className = "order-detail";
        const conf = Number.isFinite(entry.confidence) ? `置信度 ${entry.confidence}` : "";
        detail.textContent = [entry.review_label, entry.train_use, conf, entry.reason || entry.review_note]
          .filter(Boolean)
          .join(" · ");
        li.appendChild(main);
        li.appendChild(detail);
        orderList.appendChild(li);
      });
      orderItems.forEach((entry, index) => {
        reviewList.appendChild(createReviewRow(entry, index));
      });
      node.querySelector(".save-review-button").addEventListener("click", () => saveReviewRecords(node, item));
      loadReviewSummary(node, item.result_id);

      resultsList.appendChild(node);
    }

    function setBusy(busy) {
      submitButton.disabled = busy;
      clearFilesButton.disabled = busy;
      imageInput.disabled = busy;
      document.querySelectorAll("input[name='mode']").forEach((input) => {
        input.disabled = busy;
      });
    }

    submitButton.addEventListener("click", async () => {
      const files = selectedFiles;
      if (files.length === 0) {
        message.textContent = "请先选择或拍摄图片。";
        return;
      }

      const formData = new FormData();
      files.forEach((file) => formData.append("images", file));
      formData.append("mode", selectedMode());

      setBusy(true);
      message.textContent = `正在识别 ${files.length} 张图片...`;
      resultPanel.classList.add("hidden");
      resultsList.innerHTML = "";

      try {
        const response = await fetch("/api/inspect", { method: "POST", body: formData });
        const data = await response.json();
        if (!data.ok) {
          throw new Error(data.error || "识别失败");
        }

        batchMeta.textContent = `${data.mode_label || data.mode} · ${data.total} 张 · ${data.cached} 张使用缓存 · ${data.ocr_model || "official OCR"}`;
        data.results.forEach(renderResult);
        resultPanel.classList.remove("hidden");
        message.textContent = "识别完成。";
        refreshStatus();
      } catch (error) {
        message.textContent = error.message;
      } finally {
        setBusy(false);
      }
    });

    imageInput.addEventListener("change", () => addSelectedFiles(Array.from(imageInput.files)));
    clearFilesButton.addEventListener("click", () => {
      selectedFiles = [];
      imageInput.value = "";
      updateFileSummary();
    });

    refreshStatus();
    preload();
    setInterval(refreshStatus, 2500);
  </script>
</body>
</html>
